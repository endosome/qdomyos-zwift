name: Treadmill standalone CLI

on:
  push:
    paths:
      - 'tools/treadmill/**'
      - 'src/fit-sdk/**'
      - 'src/devices/fitshowtreadmill/**'
      - 'src/devices/bluetoothdevice.*'
      - 'src/devices/treadmill.*'
      - 'src/qzsettings.*'
      - 'src/metric.*'
      - '.github/workflows/treadmill.yml'
  pull_request:
    paths:
      - 'tools/treadmill/**'
      - 'src/fit-sdk/**'
      - 'src/devices/fitshowtreadmill/**'
      - 'src/devices/bluetoothdevice.*'
      - 'src/devices/treadmill.*'
      - 'src/qzsettings.*'
      - 'src/metric.*'
      - '.github/workflows/treadmill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-offline:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile Windows diagnostics and check offline gates
        shell: powershell
        run: powershell.exe -Mta -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/treadmill/tests/test_windows_diagnostics.ps1
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install standalone dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qtbase5-dev qt5-qmake qtconnectivity5-dev qtpositioning5-dev libgtest-dev python3
      - name: Build CLI and Core tests
        run: |
          mkdir -p /tmp/treadmill-build /tmp/treadmill-tests /tmp/treadmill-driver /tmp/treadmill-driver-tests
          cd /tmp/treadmill-build
          qmake "$GITHUB_WORKSPACE/tools/treadmill/treadmill.pro"
          make -j2
          cd /tmp/treadmill-tests
          qmake "$GITHUB_WORKSPACE/tools/treadmill/tests/tests.pro"
          make -j2
          cd /tmp/treadmill-driver
          qmake "$GITHUB_WORKSPACE/tools/treadmill/driver/driver.pro"
          make -j2
          cd /tmp/treadmill-driver-tests
          qmake "$GITHUB_WORKSPACE/tools/treadmill/driver/tests.pro" DRIVER_LIB=/tmp/treadmill-driver
          make -j2
          mkdir -p /tmp/treadmill-fit
          cd /tmp/treadmill-fit
          qmake "$GITHUB_WORKSPACE/tools/treadmill/fit/treadmill-fit.pro"
          make -j2
          cd /tmp/treadmill-driver-tests
          mkdir -p /tmp/treadmill-linux-helper
          cd /tmp/treadmill-linux-helper
          qmake "$GITHUB_WORKSPACE/tools/treadmill/linux/linux-helper.pro"
          make -j2
      - name: Run offline tests without a Bluetooth bus
        env:
          DBUS_SYSTEM_BUS_ADDRESS: unix:path=/tmp/treadmill-no-system-bus
        run: |
          /tmp/treadmill-tests/treadmill-tests --gtest_output=xml:/tmp/treadmill-tests/results.xml
          /tmp/treadmill-driver-tests/qz-fitshow-tests --gtest_output=xml:/tmp/treadmill-driver-tests/results.xml
          python3 tools/treadmill/tests/test_cli.py /tmp/treadmill-build/treadmill
          python3 tools/treadmill/tests/test_linux_helper.py /tmp/treadmill-linux-helper/treadmill-linux-helper
          python3 tools/treadmill/tests/test_make_plan.py /tmp/treadmill-build/treadmill
          python3 -m venv /tmp/fit-venv
          /tmp/fit-venv/bin/pip install --quiet garmin-fit-sdk
          /tmp/fit-venv/bin/python tools/treadmill/tests/test_fit.py /tmp/treadmill-fit/treadmill-fit /tmp/treadmill-build/treadmill
          TREADMILL_FIT=/tmp/treadmill-fit/treadmill-fit tools/treadmill/trainings/build.sh --check
          /tmp/fit-venv/bin/python tools/treadmill/tests/test_trainings.py /tmp/treadmill-fit/treadmill-fit /tmp/treadmill-build/treadmill
          python3 tools/treadmill/tests/test_windows_bridge.py /tmp/treadmill-build/treadmill
          python3 tools/treadmill/tests/test_motortrial.py /tmp/treadmill-build/treadmill
          python3 tools/treadmill/tests/test_summarize_run.py
      - name: Check staged installation
        run: |
          cd /tmp/treadmill-build
          make INSTALL_ROOT=/tmp/treadmill-stage install
          (cd /tmp/treadmill-linux-helper && make INSTALL_ROOT=/tmp/treadmill-stage install)
          test -x /tmp/treadmill-stage/usr/local/libexec/treadmill/treadmill-linux-helper
          /tmp/treadmill-stage/usr/local/bin/treadmill workout list
      - name: Build and check clean Linux package
        run: |
          docker build -f tools/treadmill/Dockerfile -t treadmill-offline:ci .
          python3 tools/treadmill/tests/test_package.py treadmill-offline:ci
      - name: Build and run sanitizer tests
        run: |
          mkdir -p /tmp/treadmill-sanitizers
          cd /tmp/treadmill-sanitizers
          qmake "$GITHUB_WORKSPACE/tools/treadmill/tests/tests.pro" CONFIG+=debug \
            'QMAKE_CXXFLAGS+=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            'QMAKE_LFLAGS+=-fsanitize=address,undefined'
          make -j2
          ./treadmill-tests
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treadmill-test-results
          path: |
            /tmp/treadmill-tests/results.xml
            /tmp/treadmill-driver-tests/results.xml
